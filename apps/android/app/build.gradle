plugins { id 'com.android.application' }

def metadata = new groovy.json.JsonSlurper().parse(rootProject.file('../../package.json'))
def parts = metadata.version.tokenize('.').collect { it as int }
android {
    namespace 'io.dropgrid.blockclearplay'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'io.dropgrid.blockclearplay'
        minSdk 26
        targetSdk 35
        versionCode parts[0] * 1000000 + parts[1] * 1000 + parts[2]
        versionName metadata.version
    }
    buildTypes { debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets { main { assets.srcDir layout.buildDirectory.dir('generated/gameAssets') } }
}

// A single Web production build supplies desktop, browser and Android clients.
tasks.register('syncGameAssets', Sync) {
    from(rootProject.file('../../../dist/web')) { include 'index.html', 'game.js', 'game.css' }
    into(layout.buildDirectory.dir('generated/gameAssets/web'))
    doFirst {
        ['index.html', 'game.js', 'game.css'].each { name ->
            if (!rootProject.file('../../../dist/web/' + name).isFile()) {
                throw new GradleException('Missing Web build. Run pnpm build:web in repo first.')
            }
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'syncGameAssets' }
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
