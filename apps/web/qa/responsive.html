<!doctype html><html lang="en"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local responsive QA</title>
<style>body{margin:0;padding:12px;background:#253238;font:12px system-ui;color:#fff}label{display:inline-block;margin:0 8px 10px 0}select{padding:5px}iframe{display:block;border:1px solid #64776e;background:#11191c;transform-origin:top left}#stage{overflow:visible}</style>
<label>Viewport<select id="viewport"><option value="390,844">390 × 844 phone</option><option value="360,640">360 × 640 small phone</option><option value="844,390">844 × 390 landscape</option><option value="1440,960">1440 × 960 desktop</option></select></label><label>Scale<select id="scale"><option value="1">100%</option><option value=".65">65%</option><option value=".43">43%</option></select></label><div id="stage"><iframe id="game" src="../" title="Game viewport" width="390" height="844"></iframe></div>
<script type="module">const frame=document.querySelector('#game'),view=document.querySelector('#viewport'),scale=document.querySelector('#scale');function resize(){const[w,h]=view.value.split(',');frame.width=w;frame.height=h;frame.style.transform=`scale(${scale.value})`;document.querySelector('#stage').style.height=`${Number(h)*Number(scale.value)}px`;}view.onchange=scale.onchange=resize;resize();</script></html>
